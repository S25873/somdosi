<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콤보 검색기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: 게임 창 하나 — 주황 타이틀바, 크림 패널, 주황 콤보 행 */
:root{
  --sky:#7fc8e8; --frame:#f28c1c; --frame-dk:#c96a08; --panel:#fff4e0; --row:#f0883a;
  --row-hi:#ffa24f; --ink:#3a2a1a; --white:#ffffff; --chip:#ffe680; --chip-dk:#d8b020; --navy:#23407a;
  --pixel:"DotGothic16","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--pixel);font-size:16px;
  background-image:radial-gradient(var(--white) 1.5px,transparent 1.5px);background-size:22px 22px;}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.win{background:var(--panel);border:4px solid var(--frame-dk);border-radius:10px;overflow:hidden;
  box-shadow:0 5px 0 var(--frame-dk);}
.bar{background:var(--frame);padding:12px 14px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--frame-dk)}
.badge{background:var(--chip);border:3px solid var(--chip-dk);border-radius:8px;width:44px;height:40px;display:grid;place-items:center;font-size:22px;flex:none}
.bar h1{margin:0;font-size:22px;font-weight:400;color:var(--white);
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink);letter-spacing:.02em}
.bar small{display:block;color:var(--white);font-size:12px;opacity:.95}
.body{padding:14px;display:flex;flex-direction:column;gap:12px}
.search{position:relative}
#q{width:100%;font:inherit;font-size:18px;padding:12px 44px 12px 14px;border:3px solid var(--frame-dk);border-radius:8px;background:var(--white);color:var(--ink);outline:none}
#q:focus{box-shadow:0 0 0 3px var(--chip)}
#clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--frame);color:var(--white);font:inherit;width:30px;height:30px;border-radius:6px;cursor:pointer}
.hint{font-size:13px;color:#8a6a48;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:2px solid var(--chip-dk);background:var(--chip);color:var(--ink);border-radius:6px;padding:5px 9px;cursor:pointer}
.chip b{font-weight:400;color:var(--frame-dk);margin-left:4px}
.chip:hover,.chip:focus-visible{background:var(--white);outline:none}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.head h2{margin:0;font-size:20px;font-weight:400}
.head span{font-size:14px;color:var(--frame-dk)}
.list{display:flex;flex-direction:column;gap:4px;border:3px solid #d9cbb0;border-radius:6px;padding:4px;background:var(--white)}
.row{display:grid;grid-template-columns:44px 1fr auto 1fr;align-items:center;gap:6px;background:var(--row);color:var(--white);padding:9px 8px;border-radius:3px}
.row .no{font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.row .me{text-align:center;opacity:.75;font-size:14px}
.row .plus{background:var(--chip);color:var(--frame-dk);border:2px solid var(--chip-dk);border-radius:5px;padding:0 6px;font-size:14px}
.row button{font:inherit;font-size:16px;background:transparent;border:0;color:var(--white);text-align:center;cursor:pointer;padding:2px;border-radius:4px;text-decoration:underline dotted;text-underline-offset:4px}
.row button:hover,.row button:focus-visible{background:var(--row-hi);outline:none}
.empty{padding:18px;text-align:center;color:#8a6a48}
.note{font-size:12px;color:#8a6a48;margin:0;text-align:center}
@media (prefers-reduced-motion:no-preference){.row{animation:pop .18s steps(3) both}}
@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
.tabs{display:flex;gap:6px}
.tab{flex:1;font:inherit;font-size:16px;padding:9px;border:3px solid var(--frame-dk);border-radius:8px;background:var(--white);color:var(--frame-dk);cursor:pointer}
.tab[aria-selected="true"]{background:var(--frame);color:var(--white)}
.tab:focus-visible{outline:3px solid var(--chip)}
.sets{display:flex;flex-direction:column;gap:12px}
.set{background:var(--white);border:3px solid #d9cbb0;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.set .head h2{font-size:18px}
.set .mini{display:flex;flex-direction:column;gap:3px}
.set .mini div{display:flex;gap:8px;font-size:14px;background:var(--row);color:var(--white);padding:5px 8px;border-radius:3px}
.set .mini span{opacity:.85;min-width:28px;font-variant-numeric:tabular-nums}
</style>

</head>

<div class="wrap">

      <div class="badge" aria-hidden="true">🤝</div>
      <div><h1>콤보 검색기</h1><small id="sub"></small></div>
    </div>
    <div class="body">
      <div class="tabs" role="tablist">
        <button class="tab" id="tab-search" role="tab" aria-selected="true">건물 검색</button>
        <button class="tab" id="tab-sets" role="tab" aria-selected="false">추천 조합</button>
      </div>
      <div id="pane-search" style="display:contents">
      <div class="search">
        <input id="q" type="search" autocomplete="off" placeholder="건물 이름 (예: 편의점, ㅍㅇㅈ)" aria-label="건물 검색">
        <button id="clear" aria-label="지우기">✕</button>
      </div>
      <p class="hint" id="hint">초성으로도 찾을 수 있어요. 결과의 건물을 누르면 그 건물 콤보로 넘어갑니다.</p>
      <div class="chips" id="chips"></div>
      <div id="result"></div>
      </div>
      <div id="pane-sets" class="sets" hidden>
        <p class="hint">4~7개 건물을 함께 지으면 여러 콤보가 한 번에 발동하는 묶음이에요. 건물을 누르면 검색으로 넘어갑니다.</p>
        <div id="setlist" class="sets"></div>
      </div>
      <p class="note">콤보 리스트 171/171 전체 수록</p>
    </div>
  </div>
</div>

const combos = RAW.trim().split("\n").map(l=>{
  const m = l.match(/^(\d+)\s+(.+)\|(.+)$/);
  return {no:+m[1], a:m[2].trim(), b:m[3].trim()};
});
const map = new Map();
for(const c of combos){
  for(const [me,other] of [[c.a,c.b],[c.b,c.a]]){
    if(!map.has(me)) map.set(me,[]);
    map.get(me).push({no:c.no,other});
  }
}
const names = [...map.keys()].sort((x,y)=>x.localeCompare(y,"ko"));

const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho = s => [...s].map(ch=>{const c=ch.charCodeAt(0)-0xAC00;return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch}).join("");
const norm = s => s.replace(/\s+/g,"").toLowerCase();
const index = names.map(n=>({n, k:norm(n), c:cho(norm(n))}));

const $ = id => document.getElementById(id);
const q=$("q"), chips=$("chips"), result=$("result"), hint=$("hint");
$("sub").textContent = `콤보 ${combos.length}개 · 건물 ${names.length}종`;

function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function chipHTML(list){
  return list.map(n=>`<button class="chip" data-n="${esc(n)}">${esc(n)}<b>${map.get(n).length}</b></button>`).join("");
}

function showBuilding(name){
  const list = map.get(name).slice().sort((x,y)=>x.no-y.no);
  result.innerHTML = `<div class="head"><h2>${esc(name)}</h2><span>콤보 ${list.length}개</span></div>
  <div class="list">${list.map(r=>`<div class="row"><span class="no">${r.no}</span><span class="me">${esc(name)}</span><span class="plus">+</span><button data-n="${esc(r.other)}">${esc(r.other)}</button></div>`).join("")}</div>`;
}

function render(){
  const v = norm(q.value);
  hint.hidden = !!v;
  if(!v){
    chips.innerHTML = chipHTML(names);
    result.innerHTML = "";
    return;
  }
  const exact = index.find(i=>i.k===v);
  const hits = index.filter(i=>i.k.includes(v)||i.c.includes(v)).map(i=>i.n);
  if(exact){ chips.innerHTML = hits.length>1?chipHTML(hits.filter(n=>n!==exact.n)):""; showBuilding(exact.n); return; }
  if(hits.length===1){ chips.innerHTML=""; showBuilding(hits[0]); return; }
  if(hits.length===0){ chips.innerHTML=""; result.innerHTML=`<div class="empty">"${esc(q.value)}" 건물이 목록에 없어요.</div>`; return; }
  chips.innerHTML = chipHTML(hits);
  result.innerHTML = "";
}

function pick(n){ showTab("search"); q.value=n; render(); window.scrollTo({top:0,behavior:"smooth"}); }
document.addEventListener("click",e=>{const b=e.target.closest("[data-n]"); if(b) pick(b.dataset.n);});
q.addEventListener("input",render);
$("clear").addEventListener("click",()=>{q.value="";render();q.focus();});
render();

  ["학교 마을", ["학교","운동장","도서관","대학교","학원","문구점","공중화장실"]],
  ["일본풍 마을", ["절","오중탑","기와성","온천","목욕탕","사원","붉은 다리"]],
  ["먹자골목", ["햄버거 가게","라면 가게","덮밥집","고깃집","BBQ그릴","편의점","초밥집"]],
  ["우주와 공연", ["로켓 발사대","UFO 정거장","게시판 지도","라이브 공연장","악기점","게임숍","통신사"]],
  ["놀이 거리", ["영화관","팝콘 매장","볼링장","스케이트장","이글루","양화점"]]
];
function renderSets(){
  const html = SETS.map(([title,bs])=>{
    const s=new Set(bs);
    const inside=combos.filter(c=>s.has(c.a)&&s.has(c.b)).sort((x,y)=>x.no-y.no);
    return `<div class="set"><div class="head"><h2>${esc(title)}</h2><span>건물 ${bs.length}개 · 콤보 ${inside.length}개</span></div>
    <div class="chips">${bs.map(n=>`<button class="chip" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <div class="mini">${inside.map(c=>`<div><span>${c.no}</span>${esc(c.a)} + ${esc(c.b)}</div>`).join("")}</div></div>`;
  }).join("");
  $("setlist").innerHTML = html;
}
function showTab(which){
  const isSets = which==="sets";
  $("tab-search").setAttribute("aria-selected", String(!isSets));
  $("tab-sets").setAttribute("aria-selected", String(isSets));
  $("pane-search").hidden = isSets;
  $("pane-sets").hidden = !isSets;
}
$("tab-search").addEventListener("click",()=>showTab("search"));
$("tab-sets").addEventListener("click",()=>showTab("sets"));
renderSets();
</script>
